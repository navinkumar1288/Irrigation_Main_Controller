; PlatformIO Project Configuration File
; ESP32 Heltec WiFi LoRa 32 V3 - Irrigation Main Controller
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters =
    default
    time
    esp32_exception_decoder

; Upload settings
upload_speed = 921600
upload_port = COM*  ; Auto-detect COM port (change if needed)

; Build settings
board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.embed_files = IrrigationController/emqx_ca_cert.pem

; Compiler flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Enable MQTT Protocol v5 (CRITICAL for EMQX)
    -DCONFIG_MQTT_PROTOCOL_5=1
    -DCONFIG_MQTT_PROTOCOL_311=1
    -DCONFIG_MQTT_TRANSPORT_SSL=1
    -DCONFIG_MQTT_TRANSPORT_WEBSOCKET=1
    -DCONFIG_MQTT_BUFFER_SIZE=2048
    -DCONFIG_MQTT_TASK_STACK_SIZE=6144

; Library dependencies
lib_deps =
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit BusIO@^1.14.1
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series.git

; Extra scripts (optional - for advanced users)
; extra_scripts =
;     pre:scripts/pre_build.py
;     post:scripts/post_build.py

; Specify source directory (Arduino sketch location)
src_dir = IrrigationController

; Debugging settings (optional)
debug_tool = esp-prog
debug_init_break = tbreak setup

; Custom sdkconfig options (alternative to build_flags)
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults"

; Platform-specific options
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.0
